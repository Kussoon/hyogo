<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>兵庫県 市町村記憶ゲーム｜学習モード v0.4</title>
<style>
:root{
  --ink:#1f2937;
  --line:#4b5563;
  --fill:#ffffff;
  --sea:#eef7ff;
  --selected:#fde68a;
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color:var(--ink);background:var(--sea)
}
body{display:flex;flex-direction:column}
header{
  padding:12px 14px 8px;text-align:center;background:rgba(255,255,255,.96);
  border-bottom:1px solid #dbe4ee
}
h1{font-size:clamp(20px,5vw,30px);margin:0;font-weight:800}
.sub{margin-top:5px;font-size:13px;color:#4b5563}
#answerBox{
  margin:8px auto 0;min-height:34px;display:flex;align-items:center;justify-content:center;
  width:min(92vw,560px);padding:6px 10px;border:1px solid #cbd5e1;border-radius:10px;
  background:#fff;font-size:clamp(15px,4.2vw,21px);font-weight:700;color:#0f172a
}
#mapWrap{position:relative;flex:1;min-height:68vh;overflow:hidden;touch-action:none}
svg{width:100%;height:100%;display:block}
.municipality{
  fill:var(--fill);stroke:var(--line);stroke-width:1.05;
  vector-effect:non-scaling-stroke;cursor:pointer
}
.municipality.selected{fill:var(--selected)}
.pref-outline{
  fill:none;stroke:#111827;stroke-width:2.1;
  vector-effect:non-scaling-stroke;pointer-events:none
}
.label-line{
  stroke:#7c8796;stroke-width:.72;vector-effect:non-scaling-stroke;pointer-events:none
}
.label{
  font-weight:700;fill:#111827;text-anchor:middle;dominant-baseline:middle;
  paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round;
  pointer-events:none
}
.controls{
  position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:4
}
.controls button{
  width:44px;height:44px;border:1px solid #aeb9c6;border-radius:10px;
  background:rgba(255,255,255,.96);font-size:23px;font-weight:700;
  box-shadow:0 2px 7px rgba(0,0,0,.12)
}
.controls button:last-child{font-size:12px;line-height:1.05}
#status{
  position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);
  padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.92);
  border:1px solid #cbd5e1;font-size:11px
}
footer{
  background:#fff;padding:7px 10px 10px;text-align:center;font-size:9px;line-height:1.45;
  color:#667085;border-top:1px solid #dbe4ee
}
.error{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>兵庫県 市町村記憶ゲーム</h1>
  <div class="sub">学習モード（49区域）</div>
  <div id="answerBox">地図の区域をタップしてください</div>
</header>

<main id="mapWrap">
  <svg id="map" aria-label="兵庫県49区域 名前入り学習地図"></svg>
  <div class="controls">
    <button id="zoomIn" aria-label="拡大">＋</button>
    <button id="zoomOut" aria-label="縮小">−</button>
    <button id="reset" aria-label="全体表示">全体</button>
  </div>
  <div id="status">行政区域データを読み込んでいます…</div>
</main>

<footer>
  出典：『歴史的行政区域データセットβ版』（CODH作成）／国土数値情報「行政区域データ」を加工<br>
  CC BY 4.0　© KUSSOON 2026 All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const DATA_URL = "https://geoshape.ex.nii.ac.jp/city/topojson/20230101/28/28_city.i.topojson";

const FORMAL_NAME_BY_CODE = {
  "28301":"川辺郡猪名川町",
  "28365":"多可郡多可町",
  "28381":"加古郡稲美町",
  "28382":"加古郡播磨町",
  "28442":"神崎郡市川町",
  "28443":"神崎郡福崎町",
  "28446":"神崎郡神河町",
  "28464":"揖保郡太子町",
  "28481":"赤穂郡上郡町",
  "28501":"佐用郡佐用町",
  "28585":"美方郡香美町",
  "28586":"美方郡新温泉町"
};

const KOBE_WARD_NAME_BY_CODE = {
  "28101":"神戸市東灘区",
  "28102":"神戸市灘区",
  "28105":"神戸市兵庫区",
  "28106":"神戸市長田区",
  "28107":"神戸市須磨区",
  "28108":"神戸市垂水区",
  "28109":"神戸市北区",
  "28110":"神戸市中央区",
  "28111":"神戸市西区"
};

const MAP_LABEL_BY_CODE = {
  "28101":"東灘区","28102":"灘区","28105":"兵庫区","28106":"長田区","28107":"須磨区",
  "28108":"垂水区","28109":"北区","28110":"中央区","28111":"西区",
  "28301":"猪名川町","28365":"多可町","28381":"稲美町","28382":"播磨町",
  "28442":"市川町","28443":"福崎町","28446":"神河町","28464":"太子町",
  "28481":"上郡町","28501":"佐用町","28585":"香美町","28586":"新温泉町"
};

// 読みやすさを優先して、阪神・神戸周辺は個別に位置とサイズを調整
const LABEL_LAYOUT = {
  // 神戸9区
  "28109": {dx: 0, dy: 0, size: 8.3, anchor: "middle"},
  "28111": {dx: -28, dy: -14, size: 7.8, anchor: "end"},
  "28107": {dx: -32, dy: 38, size: 7.6, anchor: "end"},
  "28108": {dx: -6, dy: 56, size: 7.6, anchor: "middle"},
  "28105": {dx: -12, dy: 56, size: 7.6, anchor: "middle"},
  "28110": {dx: 14, dy: 38, size: 7.6, anchor: "middle"},
  "28106": {dx: 28, dy: 56, size: 7.6, anchor: "start"},
  "28102": {dx: 38, dy: 8, size: 7.6, anchor: "start"},
  "28101": {dx: 58, dy: 28, size: 7.6, anchor: "start"},

  // 阪神周辺
  "28202": {dx: 0, dy: -10, size: 8.2, anchor: "middle"},   // 尼崎
  "28204": {dx: 18, dy: 10, size: 8.2, anchor: "start"},    // 西宮
  "28206": {dx: 44, dy: -4, size: 8.0, anchor: "start"},    // 芦屋
  "28207": {dx: 40, dy: -2, size: 8.0, anchor: "start"},    // 伊丹
  "28214": {dx: 6, dy: -18, size: 8.2, anchor: "middle"},   // 宝塚
  "28217": {dx: 34, dy: -28, size: 8.1, anchor: "start"},   // 川西
  "28301": {dx: 40, dy: -28, size: 8.0, anchor: "start"},   // 猪名川町
  "28219": {dx: 0, dy: -6, size: 8.4, anchor: "middle"},    // 三田

  // 東播磨周辺
  "28203": {dx: 0, dy: 8, size: 8.0, anchor: "middle"},     // 明石
  "28382": {dx: 8, dy: 24, size: 7.7, anchor: "start"},     // 播磨町
  "28381": {dx: -12, dy: -8, size: 7.9, anchor: "end"},     // 稲美町

  // 北播磨南部など少し調整
  "28216": {dx: 0, dy: 10, size: 8.0, anchor: "middle"},    // 高砂
  "28464": {dx: 0, dy: 8, size: 7.8, anchor: "middle"}      // 太子町
};

const svg = d3.select("#map");
const wrap = document.getElementById("mapWrap");
const status = document.getElementById("status");
const answerBox = document.getElementById("answerBox");
const root = svg.append("g");
const mapLayer = root.append("g");
const lineLayer = root.append("g");
const labelLayer = root.append("g");

let zoom;
let currentSelected = null;

function getCode(p){
  return String(p.N03_007 || p.code || p.CITY_CODE || p["行政区域コード"] || "");
}
function rawName(p){
  return p.N03_004 || p.name || p.city || p.CITY_NAME || p["市区町村名"] || "";
}
function formalName(p){
  const c=getCode(p);
  return KOBE_WARD_NAME_BY_CODE[c] || FORMAL_NAME_BY_CODE[c] || rawName(p);
}
function mapLabel(p){
  const c=getCode(p);
  return MAP_LABEL_BY_CODE[c] || rawName(p);
}
function makeLayout(code){
  return LABEL_LAYOUT[code] || {dx:0, dy:0, size:8.4, anchor:"middle"};
}

async function draw(){
  try{
    const topo = await fetch(DATA_URL,{mode:"cors"}).then(r=>{
      if(!r.ok) throw new Error("データ取得エラー: "+r.status);
      return r.json();
    });

    const objectKey = Object.keys(topo.objects)[0];
    const fc = topojson.feature(topo,topo.objects[objectKey]);
    const features=(fc.features||[]).map((f,i)=>{
      const p=f.properties||{};
      f.__code=getCode(p);
      f.__formal=formalName(p);
      f.__label=mapLabel(p);
      f.__id=f.__code ? "muni-"+f.__code : "muni-"+(i+1);
      return f;
    }).filter(f=>String(f.__code).startsWith("28"));

    const width=Math.max(320,wrap.clientWidth);
    const height=Math.max(500,wrap.clientHeight);
    svg.attr("viewBox",`0 0 ${width} ${height}`);

    const projection=d3.geoMercator();
    projection.fitExtent([[22,18],[width-22,height-22]],{type:"FeatureCollection",features});
    const path=d3.geoPath(projection);

    mapLayer.selectAll("path.municipality")
      .data(features)
      .join("path")
      .attr("class","municipality")
      .attr("id",d=>d.__id)
      .attr("data-code",d=>d.__code)
      .attr("data-name",d=>d.__formal)
      .attr("d",path)
      .on("click",(event,d)=>{
        if(currentSelected) d3.select("#"+currentSelected).classed("selected",false);
        currentSelected=d.__id;
        d3.select("#"+d.__id).classed("selected",true);
        answerBox.textContent=d.__formal;
        event.stopPropagation();
      });

    const geoms=(topo.objects[objectKey].geometries||[]).filter(g=>String(getCode(g.properties||{})).startsWith("28"));
    const merged=topojson.merge(topo,geoms);
    mapLayer.append("path").datum(merged).attr("class","pref-outline").attr("d",path);

    features.forEach(f=>{
      const code=f.__code;
      const centroid=path.centroid(f);
      if(!Number.isFinite(centroid[0])||!Number.isFinite(centroid[1])) return;

      const layout=makeLayout(code);
      const x=centroid[0]+layout.dx;
      const y=centroid[1]+layout.dy;
      const anchor=layout.anchor || "middle";

      if(layout.dx!==0 || layout.dy!==0){
        lineLayer.append("line")
          .attr("class","label-line")
          .attr("x1",centroid[0]).attr("y1",centroid[1])
          .attr("x2",x).attr("y2",y);
      }

      labelLayer.append("text")
        .attr("class","label")
        .attr("x",x)
        .attr("y",y)
        .style("font-size", (layout.size || 8.4) + "px")
        .style("text-anchor", anchor)
        .attr("data-code",code)
        .text(f.__label);
    });

    zoom=d3.zoom().scaleExtent([1,12]).on("zoom",e=>root.attr("transform",e.transform));
    svg.call(zoom);
    svg.on("click",()=>{
      if(currentSelected) d3.select("#"+currentSelected).classed("selected",false);
      currentSelected=null;
      answerBox.textContent="地図の区域をタップしてください";
    });

    document.getElementById("zoomIn").onclick=()=>svg.transition().duration(180).call(zoom.scaleBy,1.45);
    document.getElementById("zoomOut").onclick=()=>svg.transition().duration(180).call(zoom.scaleBy,1/1.45);
    document.getElementById("reset").onclick=()=>{
      svg.transition().duration(220).call(zoom.transform,d3.zoomIdentity);
      if(currentSelected) d3.select("#"+currentSelected).classed("selected",false);
      currentSelected=null;
      answerBox.textContent="地図の区域をタップしてください";
    };

    status.textContent=`${features.length}区域を表示中（40市町＋神戸市9区）`;
  }catch(err){
    console.error(err);
    status.innerHTML='<span class="error">地図データを読み込めませんでした。</span>';
  }
}

draw();
</script>
</body>
</html>
