<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>兵庫県 市町村記憶ゲーム｜白地図（神戸市9区版）</title>
<style>
  :root{
    --ink:#1f2937;
    --line:#374151;
    --fill:#ffffff;
    --sea:#eef7ff;
    --panel:#ffffff;
    --accent:#1d4ed8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--sea)}
  body{display:flex;flex-direction:column}
  header{
    padding:14px 16px 10px;
    text-align:center;
    background:rgba(255,255,255,.94);
    border-bottom:1px solid #dbe4ee;
  }
  h1{font-size:clamp(20px,5vw,30px);margin:0;font-weight:800}
  .sub{margin-top:5px;font-size:13px;color:#4b5563}
  #mapWrap{
    position:relative;
    flex:1;
    min-height:68vh;
    overflow:hidden;
    touch-action:none;
  }
  svg{width:100%;height:100%;display:block}
  .municipality{
    fill:var(--fill);
    stroke:var(--line);
    stroke-width:1.15;
    vector-effect:non-scaling-stroke;
  }
  .pref-outline{
    fill:none;
    stroke:#111827;
    stroke-width:2.2;
    vector-effect:non-scaling-stroke;
    pointer-events:none;
  }
  .controls{
    position:absolute;
    top:12px;
    right:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:3;
  }
  .controls button{
    width:44px;height:44px;
    border:1px solid #aeb9c6;
    border-radius:10px;
    background:rgba(255,255,255,.95);
    font-size:23px;
    font-weight:700;
    box-shadow:0 2px 7px rgba(0,0,0,.12);
  }
  .controls button:last-child{font-size:12px;line-height:1.05}
  #status{
    position:absolute;
    left:12px;
    bottom:12px;
    max-width:calc(100% - 24px);
    padding:8px 11px;
    border-radius:9px;
    background:rgba(255,255,255,.9);
    border:1px solid #cbd5e1;
    font-size:12px;
    line-height:1.45;
  }
  footer{
    background:#fff;
    padding:8px 12px 12px;
    text-align:center;
    font-size:10px;
    line-height:1.45;
    color:#667085;
    border-top:1px solid #dbe4ee;
  }
  .error{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>兵庫県 市町村記憶ゲーム</h1>
  <div class="sub">第1段階：49区域 白地図（神戸市9区版）</div>
</header>

<main id="mapWrap">
  <svg id="map" aria-label="兵庫県49区域の白地図"></svg>
  <div class="controls">
    <button id="zoomIn" aria-label="拡大">＋</button>
    <button id="zoomOut" aria-label="縮小">−</button>
    <button id="reset" aria-label="全体表示">全体</button>
  </div>
  <div id="status">行政区域データを読み込んでいます…</div>
</main>

<footer>
  出典：『歴史的行政区域データセットβ版』（CODH作成）／国土数値情報「行政区域データ」を加工<br>
  CC BY 4.0　© KUSSOON 2026 All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
/*
  仕様：
  - 神戸市のみ9区に分ける
  - それ以外は市町単位
  - 町は将来の表示用に郡名付き正式表記を内部保持
*/
const DATA_URL = "https://geoshape.ex.nii.ac.jp/city/topojson/20230101/28/28_city.i.topojson";

const svg = d3.select("#map");
const wrap = document.getElementById("mapWrap");
const status = document.getElementById("status");
const root = svg.append("g");
const mapLayer = root.append("g");

let zoom, initialTransform = d3.zoomIdentity;

// 町の正式表記（将来の学習モード・クイズ用）
const FORMAL_NAME_BY_CODE = {
  "28301": "川辺郡猪名川町",
  "28381": "加古郡稲美町",
  "28382": "加古郡播磨町",
  "28442": "多可郡多可町",
  "28443": "神崎郡市川町",
  "28446": "神崎郡福崎町",
  "28464": "神崎郡神河町",
  "28481": "揖保郡太子町",
  "28501": "赤穂郡上郡町",
  "28585": "佐用郡佐用町",
  "28586": "美方郡香美町",
  "28587": "美方郡新温泉町"
};

// 神戸市9区は区名で表示
const KOBE_WARD_NAME_BY_CODE = {
  "28101": "神戸市東灘区",
  "28102": "神戸市灘区",
  "28105": "神戸市兵庫区",
  "28106": "神戸市長田区",
  "28107": "神戸市須磨区",
  "28108": "神戸市垂水区",
  "28109": "神戸市北区",
  "28110": "神戸市中央区",
  "28111": "神戸市西区"
};

function getCode(props){
  return props.N03_007 || props.code || props.CITY_CODE || props["行政区域コード"] || "";
}

function getRawName(props){
  return props.N03_004 || props.name || props.city || props.CITY_NAME || props["市区町村名"] || "";
}

function getDisplayName(props){
  const code = getCode(props);
  if (KOBE_WARD_NAME_BY_CODE[code]) return KOBE_WARD_NAME_BY_CODE[code];
  if (FORMAL_NAME_BY_CODE[code]) return FORMAL_NAME_BY_CODE[code];
  return getRawName(props);
}

function isHyogoArea(feature){
  const code = String(feature.__code || "");
  return code.startsWith("28");
}

async function draw(){
  try{
    const topo = await fetch(DATA_URL, {mode:"cors"}).then(r=>{
      if(!r.ok) throw new Error("データ取得エラー: " + r.status);
      return r.json();
    });

    const objectKey = Object.keys(topo.objects)[0];
    const fc = topojson.feature(topo, topo.objects[objectKey]);
    let features = (fc.features || []).map((f, i) => {
      const props = f.properties || {};
      const code = getCode(props);
      f.__code = code;
      f.__rawName = getRawName(props);
      f.__displayName = getDisplayName(props);
      f.__id = code ? "muni-" + code : "muni-" + (i+1);
      return f;
    }).filter(isHyogoArea);

    const width = Math.max(320, wrap.clientWidth);
    const height = Math.max(460, wrap.clientHeight);
    svg.attr("viewBox", `0 0 ${width} ${height}`);

    const projection = d3.geoMercator();
    projection.fitExtent([[26,22],[width-26,height-26]], {type:"FeatureCollection",features});
    const path = d3.geoPath(projection);

    mapLayer.selectAll("path.municipality")
      .data(features)
      .join("path")
      .attr("class","municipality")
      .attr("id",d=>d.__id)
      .attr("data-name",d=>d.__displayName)
      .attr("data-raw-name",d=>d.__rawName)
      .attr("data-code",d=>d.__code)
      .attr("d",path);

    // 外周
    const merged = topojson.merge(
      topo,
      (topo.objects[objectKey].geometries || []).filter(g => {
        const code = String(getCode(g.properties || {}));
        return code.startsWith("28");
      })
    );

    mapLayer.append("path")
      .datum(merged)
      .attr("class","pref-outline")
      .attr("d",path);

    zoom = d3.zoom()
      .scaleExtent([1,10])
      .on("zoom", e => root.attr("transform", e.transform));

    svg.call(zoom);
    svg.call(zoom.transform, initialTransform);

    const count = features.length;
    const note = (count === 49)
      ? "49区域を表示中（40市町＋神戸市9区）"
      : `${count}区域を表示中 ※件数を要確認`;
    status.textContent = note;
  }catch(err){
    console.error(err);
    status.innerHTML = '<span class="error">地図データを読み込めませんでした。</span><br>インターネット接続とNII側の配信状況を確認してください。';
  }
}

document.getElementById("zoomIn").addEventListener("click",()=>svg.transition().duration(180).call(zoom.scaleBy,1.45));
document.getElementById("zoomOut").addEventListener("click",()=>svg.transition().duration(180).call(zoom.scaleBy,1/1.45));
document.getElementById("reset").addEventListener("click",()=>svg.transition().duration(220).call(zoom.transform,initialTransform));

draw();
</script>
</body>
</html>
