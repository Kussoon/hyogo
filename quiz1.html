<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>クイズ1 名前→場所｜兵庫県 市町村記憶ゲーム</title>
<style>
:root{
  --ink:#1f2937;
  --line:#5b6470;
  --outline:#111827;
  --fill:#f8fafc;
  --kobe:#e5e7eb;
  --sea:#eef4fb;
  --panel:#ffffff;
  --border:#dbe4ee;
  --correct:#a7f3d0;
  --wrong:#fee2e2;
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color:var(--ink);background:var(--sea)
}
body{display:flex;flex-direction:column}
.topnav{
  background:#fff;padding:8px 12px;border-bottom:1px solid var(--border)
}
.topnav a{color:#334155;text-decoration:none;font-size:14px;font-weight:700}
header{
  background:var(--panel);text-align:center;padding:10px 12px 8px
}
h1{margin:0;font-size:clamp(21px,5.5vw,30px)}
.sub{margin-top:5px;font-size:16px;font-weight:700}
#question{
  margin:8px auto 0;
  width:min(94vw,640px);
  min-height:52px;
  border:1px solid #cbd5e1;
  border-radius:11px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 12px;
  font-size:clamp(18px,5vw,24px);
  font-weight:800;
  line-height:1.35;
}
#progress{margin-top:6px;font-size:13px;color:#64748b;font-weight:700}
#quizActionRow{
  display:none;
  margin-top:8px;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}
#restartBtn,#headerRangeBtn{
  border:1px solid #aeb9c6;
  background:#fff;
  color:#334155;
  border-radius:10px;
  padding:8px 14px;
  font-size:13px;
  font-weight:800;
  min-height:38px;
}
#mapWrap{
  position:relative;flex:1;min-height:54vh;overflow:hidden;touch-action:none;background:var(--sea)
}
svg{width:100%;height:100%;display:block}
.municipality{
  fill:var(--fill);stroke:var(--line);stroke-width:1.05;
  vector-effect:non-scaling-stroke;cursor:pointer
}
.municipality.kobe-base{fill:var(--kobe)}
.municipality.correct{fill:var(--correct)}
.municipality.wrong-flash{fill:var(--wrong)}
.pref-outline{
  fill:none;stroke:var(--outline);stroke-width:1.8;
  vector-effect:non-scaling-stroke;pointer-events:none
}
.kobe-outline{
  fill:none;stroke:var(--outline);stroke-width:1.5;
  vector-effect:non-scaling-stroke;pointer-events:none
}
.controls{
  position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:5
}
.controls button{
  width:46px;height:46px;border:1px solid #aeb9c6;border-radius:10px;
  background:rgba(255,255,255,.96);box-shadow:0 2px 7px rgba(0,0,0,.12);
  font-weight:700;color:#1f2937
}
.controls button.zoom{font-size:24px}
.controls button.reset{font-size:12px;line-height:1.05}
#feedback{
  position:absolute;
  left:50%;top:18px;transform:translateX(-50%);
  z-index:6;
  min-width:120px;max-width:88vw;
  text-align:center;
  padding:9px 16px;
  border-radius:999px;
  background:rgba(255,255,255,.96);
  border:1px solid #cbd5e1;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
  font-size:16px;
  font-weight:900;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
#feedback.show{opacity:1}
#feedback.ok{color:#047857}
#feedback.ng{color:#b91c1c}
#result{
  display:none;
  position:absolute;
  inset:0;
  z-index:10;
  background:rgba(238,244,251,.96);
  align-items:flex-start;
  justify-content:center;
  padding:12px 20px 20px;
}
.result-card{
  width:min(92vw,460px);
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  text-align:center;
  box-shadow:0 8px 24px rgba(15,23,42,.12);
}
.result-card h2{margin:0 0 10px;font-size:25px}
.result-card p{font-size:16px;line-height:1.6;margin:8px 0 18px}
.result-card button,.result-card a{
  display:block;width:100%;padding:12px 14px;margin-top:9px;
  border-radius:12px;font-size:16px;font-weight:800;text-decoration:none
}
.result-card button{
  border:1px solid #9fb1c4;background:#f8fbff;color:#17324d
}
.result-card .primary{background:#315f8c;color:#fff;border-color:#315f8c}
.result-card a{border:1px solid #cbd5e1;color:#334155;background:#fff}



body.range-selecting #mapWrap{
  min-height:0;
  height:auto;
  flex:none;
  overflow:visible;
  padding-bottom:0;
}
body.range-selecting #startPanel{
  position:relative;
  inset:auto;
  min-height:0;
}
body.range-selecting #map,
body.range-selecting .controls,
body.range-selecting #choices{
  display:none;
}
#startPanel{
  position:absolute;
  inset:0;
  z-index:20;
  background:rgba(238,244,251,.97);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:12px 18px 18px;
}
.start-card{
  width:min(94vw,560px);
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 24px rgba(15,23,42,.12);
}
.start-card h2{
  margin:0 0 6px;
  text-align:center;
  font-size:23px;
}
.start-card p{
  margin:0 0 12px;
  text-align:center;
  color:#64748b;
  font-size:13px;
}
.all-challenge{
  display:block;
  width:100%;
  min-height:52px;
  margin:0 0 12px;
  border:1px solid #315f8c;
  border-radius:12px;
  background:#315f8c;
  color:#fff;
  font-size:18px;
  font-weight:900;
}
.range-map-wrap{
  width:100%;
  border:1px solid #d7e0ea;
  border-radius:14px;
  background:#eef4fb;
  overflow:hidden;
}
#rangeMap{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:0.82;
}
.range-region{
  fill:#f8fafc;
  stroke:none;
  cursor:pointer;
}
.range-region:hover{fill:#eaf2f8}
.range-boundary{
  fill:none;
  stroke:#9aa8b8;
  stroke-width:1.1;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}
.range-outline{
  fill:none;
  stroke:#1f2937;
  stroke-width:1.8;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}
.range-label{
  fill:#111827;
  font-weight:900;
  font-size:14px;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:#fff;
  stroke-width:4px;
  stroke-linejoin:round;
  pointer-events:none;
}

footer{
  background:#fff;border-top:1px solid var(--border);
  text-align:center;font-size:9px;line-height:1.45;color:#667085;padding:8px 10px 10px
}
</style>
</head>
<body>
<div class="topnav"><a href="index.html">← トップへ</a></div>
<header>
  <h1>兵庫県 市町村記憶ゲーム</h1>
  <div class="sub">🎯 クイズ1　名前を見て、その場所を地図で選ぶ</div>
  <div id="question" style="display:none;">地図を読み込んでいます…</div>
  <div id="progress" style="display:none;"></div>
  <div id="quizActionRow">
    <button id="restartBtn" type="button">もう一度最初から</button>
    <button id="headerRangeBtn" type="button">出題範囲を選び直す</button>
  </div>
</header>

<main id="mapWrap">
  <svg id="map" aria-label="兵庫県 市町村場所当てクイズ"></svg>
  <div class="controls">
    <button id="zoomIn" class="zoom" type="button" aria-label="拡大">＋</button>
    <button id="zoomOut" class="zoom" type="button" aria-label="縮小">−</button>
    <button id="resetButton" class="reset" type="button" aria-label="全体表示">全体</button>
  </div>
  <div id="startPanel">
    <div class="start-card">
      <h2>出題範囲を選ぶ</h2>
      
      <button id="allChallengeBtn" class="all-challenge" type="button">全域でチャレンジ</button>
      <div class="range-map-wrap">
        <svg id="rangeMap" viewBox="0 0 400 490" aria-label="兵庫県10地域の選択地図"></svg>
      </div>
    </div>
  </div>
  <div id="feedback"></div>

  <div id="result">
    <div class="result-card">
      <h2>採点結果</h2>
      <p id="resultText"></p>
      <button id="againBtn" class="primary">もう一度最初から</button>
      <button id="wrongBtn">間違えた問題だけもう一度</button>
      <button id="rangeBtn">出題範囲を選び直す</button>
      <a href="index.html">トップへ</a>
    </div>
  </div>
</main>

<footer>
  地図境界データ：『歴史的行政区域データセットβ版』（CODH作成）／国土数値情報「行政区域データ」を加工。CC BY 4.0<br>
  © KUSSOON 2026 All Rights Reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const DATA_URL="hyogo-city.topojson";

const QUIZ_RANGES = [
  {key:"all", name:"全49区域", codes:null},
  {key:"kobe", name:"神戸", codes:["28101","28102","28105","28106","28107","28108","28109","28110","28111"]},
  {key:"hanshin-s", name:"阪神南", codes:["28202","28204","28206"]},
  {key:"hanshin-n", name:"阪神北", codes:["28207","28214","28217","28219","28301"]},
  {key:"higashi", name:"東播磨", codes:["28203","28210","28216","28381","28382"]},
  {key:"kita", name:"北播磨", codes:["28213","28215","28218","28220","28228","28365"]},
  {key:"naka", name:"中播磨", codes:["28201","28442","28443","28446"]},
  {key:"nishi", name:"西播磨", codes:["28208","28212","28227","28229","28464","28481","28501"]},
  {key:"tajima", name:"但馬", codes:["28209","28222","28225","28585","28586"]},
  {key:"tamba", name:"丹波", codes:["28221","28223"]},
  {key:"awaji", name:"淡路", codes:["28205","28224","28226"]}
];


const FORMAL_NAME_BY_CODE={
  "28101":"神戸市東灘区","28102":"神戸市灘区","28105":"神戸市兵庫区","28106":"神戸市長田区",
  "28107":"神戸市須磨区","28108":"神戸市垂水区","28109":"神戸市北区","28110":"神戸市中央区","28111":"神戸市西区",
  "28301":"川辺郡猪名川町","28365":"多可郡多可町","28381":"加古郡稲美町","28382":"加古郡播磨町",
  "28442":"神崎郡市川町","28443":"神崎郡福崎町","28446":"神崎郡神河町","28464":"揖保郡太子町",
  "28481":"赤穂郡上郡町","28501":"佐用郡佐用町","28585":"美方郡香美町","28586":"美方郡新温泉町"
};

const svg=d3.select("#map");
const mapWrap=document.getElementById("mapWrap");
const questionEl=document.getElementById("question");
const progressEl=document.getElementById("progress");
const feedback=document.getElementById("feedback");
const result=document.getElementById("result");
const resultText=document.getElementById("resultText");
const wrongBtn=document.getElementById("wrongBtn");
const startPanel=document.getElementById("startPanel");
const rangeMap=document.getElementById("rangeMap");
const root=svg.append("g");
const mapLayer=root.append("g");

let zoom,path,features=[];
let allCodes=[];
let queue=[];
let index=0;
let currentCode=null;
let wrongSet=new Set();
let locked=false;
let currentRangeCodes=[];

function getCode(p){
  return String(p.N03_007||p.code||p.CITY_CODE||p["行政区域コード"]||"");
}
function rawName(p){
  return p.N03_004||p.name||p.city||p.CITY_NAME||p["市区町村名"]||"";
}
function formalName(feature){
  return FORMAL_NAME_BY_CODE[feature.__code]||feature.__rawName;
}


function setQuizHeaderVisible(visible){
  document.getElementById("question").style.display = visible ? "flex" : "none";
  document.getElementById("progress").style.display = visible ? "block" : "none";
  document.getElementById("quizActionRow").style.display = visible ? "flex" : "none";
}


const REGION_LABEL_OFFSET={
  "kobe":{dx:-8,dy:4},
  "hanshin-s":{dx:12,dy:0},
  "hanshin-n":{dx:12,dy:-2},
  "higashi":{dx:-3,dy:0},
  "kita":{dx:0,dy:-2},
  "naka":{dx:0,dy:0},
  "nishi":{dx:-5,dy:0},
  "tajima":{dx:0,dy:0},
  "tamba":{dx:2,dy:0},
  "awaji":{dx:0,dy:0}
};
function beginRange(r){
  currentRangeCodes = r.codes ? r.codes.filter(c=>allCodes.includes(c)) : [...allCodes];
  document.body.classList.remove("range-selecting");
  startPanel.style.display="none";
  setQuizHeaderVisible(true);
  startQuiz(currentRangeCodes);
}
function buildRangeMap(topo,objectKey){
  const rsvg=d3.select("#rangeMap");
  rsvg.selectAll("*").remove();
  const geoms=(topo.objects[objectKey].geometries||[]).filter(g=>getCode(g.properties||{}).startsWith("28"));
  const regionRanges=QUIZ_RANGES.filter(r=>r.key!=="all");
  const codeToRegion={};
  regionRanges.forEach(r=>r.codes.forEach(c=>codeToRegion[c]=r.key));
  const regionFeatures=[];
  regionRanges.forEach(r=>{
    const set=new Set(r.codes);
    const rgeoms=geoms.filter(g=>set.has(getCode(g.properties||{})));
    if(rgeoms.length) regionFeatures.push({range:r,geometry:topojson.merge(topo,rgeoms)});
  });
  const projection=d3.geoMercator();
  projection.fitExtent([[18,16],[382,474]],{type:"FeatureCollection",features:features});
  const rpath=d3.geoPath(projection);
  rsvg.selectAll("path.range-region")
    .data(regionFeatures).join("path")
    .attr("class","range-region")
    .attr("d",d=>rpath(d.geometry))
    .on("click",(event,d)=>beginRange(d.range));
  const mesh=topojson.mesh(topo,topo.objects[objectKey],(a,b)=>{
    if(!a||!b)return false;
    const ca=getCode(a.properties||{}), cb=getCode(b.properties||{});
    return !!codeToRegion[ca] && !!codeToRegion[cb] && codeToRegion[ca]!==codeToRegion[cb];
  });
  rsvg.append("path").datum(mesh).attr("class","range-boundary").attr("d",rpath);
  rsvg.append("path").datum(topojson.merge(topo,geoms)).attr("class","range-outline").attr("d",rpath);
  rsvg.selectAll("text.range-label")
    .data(regionFeatures).join("text")
    .attr("class","range-label")
    .attr("x",d=>rpath.centroid(d.geometry)[0]+(REGION_LABEL_OFFSET[d.range.key]?.dx||0))
    .attr("y",d=>rpath.centroid(d.geometry)[1]+(REGION_LABEL_OFFSET[d.range.key]?.dy||0))
    .text(d=>d.range.name);
  document.getElementById("allChallengeBtn").onclick=()=>beginRange(QUIZ_RANGES.find(r=>r.key==="all"));
}
function tryAutoStartFromQuery(){
  const params=new URLSearchParams(location.search);
  const key=params.get("range");
  if(!key)return false;
  const r=QUIZ_RANGES.find(x=>x.key===key);
  if(!r)return false;
  beginRange(r);
  return true;
}
function openRangeSelect(){
  result.style.display="none";
  setQuizHeaderVisible(false);
  document.body.classList.add("range-selecting");
  startPanel.style.display="flex";
}

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}
function showFeedback(text,type){
  feedback.textContent=text;
  feedback.className="show "+type;
}
function hideFeedback(){
  feedback.className="";
}
function resetMapColors(){
  mapLayer.selectAll(".municipality")
    .classed("correct",false)
    .classed("wrong-flash",false);
}
function startQuiz(codes){
  currentRangeCodes=[...codes];
  queue=shuffle(codes);
  index=0;
  currentCode=null;
  wrongSet=new Set();
  locked=false;
  result.style.display="none";
  resetMapColors();
  svg.call(zoom.transform,d3.zoomIdentity);
  showQuestion();
}
function showQuestion(){
  hideFeedback();
  resetMapColors();
  if(index>=queue.length){
    finishQuiz();
    return;
  }
  currentCode=queue[index];
  const f=features.find(x=>x.__code===currentCode);
  questionEl.textContent=`${formalName(f)} はどこですか？`;
  progressEl.textContent=`${index+1} / ${queue.length}`;
  locked=false;
}
function answer(event,selectedFeature){
  if(locked||!currentCode)return;
  const selectedCode=selectedFeature.__code;
  if(selectedCode===currentCode){
    locked=true;
    d3.select(event.currentTarget).classed("correct",true);
    showFeedback("正解です！","ok");
    setTimeout(()=>{
      index++;
      showQuestion();
    },1500);
  }else{
    wrongSet.add(currentCode);
    d3.select(event.currentTarget).classed("wrong-flash",true);
    showFeedback(`違います！ そこは${formalName(selectedFeature)}です。`,"ng");
    setTimeout(()=>{
      d3.select(event.currentTarget).classed("wrong-flash",false);
      if(!locked) hideFeedback();
    },1400);
  }
}
function finishQuiz(){
  locked=true;
  const wrongCount=wrongSet.size;
  const correctFirst=queue.length-wrongCount;
  questionEl.textContent="クイズ終了";
  progressEl.textContent="";
  const score=Math.round((correctFirst/queue.length)*100);
  resultText.innerHTML=`<strong>${score}点</strong><br>${queue.length}問中 ${correctFirst}問を最初のタップで正解しました。<br>間違えた問題：${wrongCount}問`;
  wrongBtn.style.display=wrongCount?"block":"none";
  result.style.display="flex";
}
async function draw(){
  try{
    const topo=await fetch(DATA_URL,{mode:"cors"}).then(r=>{
      if(!r.ok)throw new Error("data");
      return r.json();
    });
    const objectKey=Object.keys(topo.objects)[0];
    const fc=topojson.feature(topo,topo.objects[objectKey]);
    features=(fc.features||[]).map((f,i)=>{
      const p=f.properties||{};
      f.__code=getCode(p);
      f.__rawName=rawName(p);
      f.__id=f.__code?`muni-${f.__code}`:`muni-${i+1}`;
      return f;
    }).filter(f=>f.__code.startsWith("28"));
    allCodes=features.map(f=>f.__code);

    const width=Math.max(320,mapWrap.clientWidth);
    const height=Math.max(540,mapWrap.clientHeight);
    svg.attr("viewBox",`0 0 ${width} ${height}`);

    const projection=d3.geoMercator();
    projection.fitExtent([[22,18],[width-22,height-22]],{type:"FeatureCollection",features});
    path=d3.geoPath(projection);

    mapLayer.selectAll("path.municipality")
      .data(features).join("path")
      .attr("class",d=>d.__code.startsWith("281")?"municipality kobe-base":"municipality")
      .attr("id",d=>d.__id)
      .attr("d",path)
      .on("click",answer);

    const allGeoms=(topo.objects[objectKey].geometries||[]).filter(g=>getCode(g.properties||{}).startsWith("28"));
    const kobeGeoms=allGeoms.filter(g=>getCode(g.properties||{}).startsWith("281"));
    mapLayer.append("path")
      .datum(topojson.merge(topo,kobeGeoms))
      .attr("class","kobe-outline")
      .attr("d",path);
    mapLayer.append("path")
      .datum(topojson.merge(topo,allGeoms))
      .attr("class","pref-outline")
      .attr("d",path);

    zoom=d3.zoom().scaleExtent([1,12]).on("zoom",e=>root.attr("transform",e.transform));
    svg.call(zoom);

    document.getElementById("zoomIn").onclick=()=>svg.transition().duration(180).call(zoom.scaleBy,1.45);
    document.getElementById("zoomOut").onclick=()=>svg.transition().duration(180).call(zoom.scaleBy,1/1.45);
    document.getElementById("resetButton").onclick=()=>svg.transition().duration(220).call(zoom.transform,d3.zoomIdentity);

    document.getElementById("restartBtn").onclick=()=>startQuiz(currentRangeCodes);
    document.getElementById("headerRangeBtn").onclick=openRangeSelect;
    document.getElementById("againBtn").onclick=()=>startQuiz(currentRangeCodes);
    document.getElementById("rangeBtn").onclick=openRangeSelect;
    wrongBtn.onclick=()=>{
      const retry=[...wrongSet];
      startQuiz(retry);
    };

    buildRangeMap(topo,objectKey);
    if(!tryAutoStartFromQuery()) openRangeSelect();
  }catch(e){
    console.error(e);
    questionEl.textContent="地図データを読み込めませんでした。";
  }
}
draw();
</script>
</body>
</html>
