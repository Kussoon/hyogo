<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>兵庫県V2・10地域と市区町村名｜Kussoon</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#193b51;background:#f0f7fc}*{box-sizing:border-box}
body{margin:0}main{max-width:960px;margin:auto;padding:20px 14px 52px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}
p{line-height:1.7}.panel{background:white;border:1px solid #bdd2df;border-radius:18px;padding:18px;margin:14px 0}
.regions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media(min-width:680px){.regions{grid-template-columns:repeat(5,minmax(0,1fr))}}
button{border:1px solid #97b7ca;border-radius:12px;min-height:48px;padding:8px 6px;background:#fff;color:inherit;font:inherit;font-weight:650}
button[aria-pressed="true"]{background:#d9ecf7;border:2px solid #34799d}
.regions button ruby{ruby-position:over;white-space:nowrap}
.regions button rt{font-size:.65em;font-weight:700;letter-spacing:.02em}
.regions button .count{white-space:nowrap}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media(min-width:680px){.items{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{padding:10px 6px;border-radius:9px;background:#eef6fa;text-align:center;overflow-wrap:anywhere}
.item ruby{font-size:1.05rem;font-weight:650}rt{font-size:.65em}a{color:#155a7c}
</style></head><body><main>
<p><a href="/hyogo/">← 兵庫県の学習トップへ</a></p>
<h1>兵庫県V2・10地域と市区町村名</h1>
<p>地域を選ぶと、その地域に含まれる市区町村名を一覧で確認できます。10地域はクイズの出題範囲にも使います。</p>
<section class="panel"><h2>地域を選択</h2><div id="regions" class="regions" aria-label="兵庫県の地域を選択"></div>
<h3 id="selection">読み込み中…</h3><div id="items" class="items" aria-live="polite"></div>
<p id="status" role="status"></p></section>
<section class="panel"><h2>兵庫県V2のクイズ</h2>
<p><a href="/hyogo/v2-quiz1.html">クイズ1：地名から場所を当てる</a></p>
<p><a href="/hyogo/v2-quiz2.html">クイズ2：光っている場所は？</a></p></section>
</main>
<script src="/hyogo/v2-regions.js"></script>
<script>
(async function(){'use strict';
const box=document.getElementById('regions'),list=document.getElementById('items'),heading=document.getElementById('selection'),status=document.getElementById('status');
try{
 const regions=window.KussoonHyogoV2Regions.regions;
 const response=await fetch('/v2/progressive-preview/label-index.json');
 if(!response.ok)throw Error('市区町村データを読み込めません');
 const idx=await response.json(),hyogo=idx.entries.filter(e=>e.pref==='28');
 const byCode=new Map(hyogo.map(e=>[e.code,e])),codes=regions.flatMap(r=>r.codes);
 if(idx.count!==1905||hyogo.length!==49||regions.length!==10||codes.length!==49||
    new Set(codes).size!==49||codes.some(code=>!byCode.has(code)))throw Error('兵庫県49区域の照合に失敗しました');
 const make=(tag,content)=>{const el=document.createElement(tag);el.textContent=content;return el;};
 function select(region){
  for(const btn of box.children)btn.setAttribute('aria-pressed',String(btn.dataset.key===region.key));
  heading.textContent=region.name+'：'+region.codes.length+'区域';
  list.replaceChildren();
  for(const code of region.codes){
   const entry=byCode.get(code),tile=make('div','');tile.className='item';
   const ruby=document.createElement('ruby');ruby.append(make('span',entry.fullName||entry.name));
   if(entry.reading)ruby.append(make('rt',entry.reading));
   tile.append(ruby);list.append(tile);
  }
 }
 for(const region of regions){
  const button=make('button',''),ruby=make('ruby',region.name),count=make('span','（'+region.codes.length+'）');
  if(region.reading)ruby.append(make('rt',region.reading));
  count.className='count';button.append(ruby,count);
  button.dataset.key=region.key;button.type='button';button.setAttribute('aria-pressed','false');
  button.onclick=()=>select(region);box.append(button);
 }
 select(regions[0]);status.textContent='2026年版49区域・10地域のコード照合：合格';
}catch(error){heading.textContent='読み込みエラー';status.textContent=error.message;console.error(error);}
})();
</script><script defer src="/common/site-footer.js"></script></body></html>
