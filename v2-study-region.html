<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>兵庫県10地域を覚える｜V2試作｜Kussoon</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#173950;background:#f1f7fb}
*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:16px 12px}
a{color:#23577b}header{margin:5px 0 14px}h1{font-size:clamp(21px,5vw,28px);margin:12px 0}
p{line-height:1.6}.panel{background:#fff;border:1px solid #c1d5e2;border-radius:15px;padding:14px;margin:14px 0}
#map{width:100%;height:clamp(430px,75svh,800px);background:#edf6fb;border:1px solid #c0d4e1;border-radius:13px;touch-action:none;user-select:none;display:block}
.region{fill:#f8fcff;stroke:#88a1b6;stroke-width:1.3;vector-effect:non-scaling-stroke;cursor:pointer}
.region:hover,.region:focus-visible{fill:#d9edf8;stroke:#256084;outline:none}
.region-label{pointer-events:none;text-anchor:middle;dominant-baseline:central;font-size:17px;font-weight:800;fill:#173950;stroke:#fff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
#buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0}
#buttons a{display:block;padding:10px 3px;background:#f4faff;color:#153b55;border:1px solid #a5bfce;border-radius:9px;text-align:center;text-decoration:none;font-weight:750;font-size:clamp(12px,3.4vw,16px)}
.map-frame{position:relative}.map-controls{position:absolute;right:12px;top:12px;display:grid;gap:7px;z-index:2}
.map-controls button{font:inherit;background:#fff;border:1px solid #b2c8d7;border-radius:9px;padding:9px 13px;min-width:54px;font-weight:800;font-size:19px;box-shadow:0 2px 8px #163c5522}
.map-controls button:last-child{font-size:13px}#status{font-size:13px;color:#43677f;min-height:24px}.note{font-size:13px;color:#456b82}
</style></head><body>
<main>
<header><a href="/hyogo/">← 兵庫県の学習トップへ</a><h1>兵庫県の10地域を覚える（V2試作）</h1>
<p>2026年版の行政区域データから10地域の地図を作ります。地図または地域名を押すと、全国共通地図でその地域にフォーカスします。</p></header>
<section class="panel"><h2>地域を選んでください</h2>
<nav id="buttons" aria-label="兵庫県の10地域"></nav>
<div class="map-frame"><svg id="map" role="img" aria-label="兵庫県の10地域を選ぶ地図"></svg>
<div class="map-controls"><button type="button" id="in" aria-label="拡大">＋</button><button type="button" id="out" aria-label="縮小">－</button><button type="button" id="reset">全体</button></div></div>
<p id="status">地図を読み込んでいます。</p>
<p class="note">地域を選択すると、周囲の地図を残したまま、その地域の地名だけを表示します。全国版のラベル配置・縮尺・地図操作は変更しません。</p>
</section><p><a href="/hyogo/v2-quiz1.html">クイズ1（V2試作）</a> ／ <a href="/hyogo/study-region.html">従来の地域別学習</a> ／ <a href="/hyogo/quiz1.html">従来のクイズ1</a> ／ <a href="/hyogo/quiz2.html">クイズ2</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="/hyogo/v2-regions.js"></script>
<script>
(async function(){'use strict';
const {regions}=window.KussoonHyogoV2Regions,svg=d3.select('#map'),status=document.getElementById('status'),nav=document.getElementById('buttons');
const url=key=>'/v2/national/study-region-trial/index.html?studyPref=28&studyRegion='+encodeURIComponent(key);
for(const region of regions){const a=document.createElement('a');a.href=url(region.key);a.textContent=region.name;nav.append(a);}
try{
 const manifestResponse=await fetch('/v2/data/national/2026-common/national-2026-pilot/manifest.json');
 if(!manifestResponse.ok)throw Error('manifest HTTP '+manifestResponse.status);
 const manifest=await manifestResponse.json(),entry=manifest.entries.find(e=>e.pref==='28');
 if(!entry)throw Error('2026年の兵庫県データがありません');
 const dataResponse=await fetch('/v2/data/national/2026-common/'+entry.source);
 if(!dataResponse.ok)throw Error('地図 HTTP '+dataResponse.status);
 const topo=await dataResponse.json(),obj=topo.objects.municipalities;
 if(!obj)throw Error('行政区域が見つかりません');
 const geoms=obj.geometries.filter(g=>String(g.properties?.N03_007).startsWith('28'));
 const observed=new Set(geoms.map(g=>String(g.properties?.N03_007)));
 const expected=regions.flatMap(r=>r.codes);
 if(observed.size!==49||expected.some(code=>!observed.has(code)))throw Error('10地域と2026年版49区域の対応に差異があります');
 const all=topojson.merge(topo,geoms),features=regions.map(r=>({region:r,shape:topojson.merge(topo,geoms.filter(g=>r.codes.includes(String(g.properties.N03_007))))}));
 const W=850,H=850,projection=d3.geoMercator().fitExtent([[27,27],[W-27,H-27]],{type:'Feature',geometry:all});
 const path=d3.geoPath(projection);svg.attr('viewBox','0 0 '+W+' '+H);
 const root=svg.append('g');
 root.selectAll('path.region').data(features).join('path').attr('class','region').attr('d',d=>path(d.shape)).attr('tabindex','0').attr('role','link')
  .attr('aria-label',d=>d.region.name+'の市区町村地図を開く')
  .on('click',(_,d)=>{location.href=url(d.region.key);})
  .on('keydown',(event,d)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();location.href=url(d.region.key);}});
 root.selectAll('text.region-label').data(features).join('text').attr('class','region-label')
  .attr('x',d=>path.centroid(d.shape)[0]).attr('y',d=>path.centroid(d.shape)[1]).text(d=>d.region.name);
 const zoom=d3.zoom().scaleExtent([1,12]).on('zoom',event=>{
  root.attr('transform',event.transform);
  root.selectAll('text.region-label').attr('font-size',17/event.transform.k)
    .attr('stroke-width',4/event.transform.k);
 });
 svg.call(zoom);
 document.getElementById('in').onclick=()=>svg.transition().duration(160).call(zoom.scaleBy,1.6);
 document.getElementById('out').onclick=()=>svg.transition().duration(160).call(zoom.scaleBy,1/1.6);
 document.getElementById('reset').onclick=()=>svg.transition().duration(160).call(zoom.transform,d3.zoomIdentity);
 status.textContent='10地域・49区域を2026年版の境界データから表示しています。';
}catch(error){console.error(error);status.textContent='地図の読み込みに失敗しました：'+error.message;}
})();
</script><script defer src="/common/site-footer.js"></script></body></html>
